# MachineProfile по умолчанию: Haas (этап 3, agent C — регистрация "haas";
# TOML с итерации 3 — R-1; по образцу fanuc_default.toml #25/ff090bd).
#
# СТАТУС: диалект "haas" LIVE — адаптер eid-haas в registry
# (eid-integration::translate::AnyAdapter::for_name("haas") → обёртка
# HaasNamedAdapter; канон крейта — "haas-mill"). translate --from/--to haas
# обрабатывается реально; verify --dialect haas — тоже.
#
# Лимиты — дефолты COVERAGE §1.2 (200000 / 10000 / 1000000 / 32).
# emit_r_arcs: false — политика EQUIVALENCE §4: эмиссия дуг всегда IJK
# (Haas R поддерживает, но канон-контракт — инкрементальный центр; R-форма
# Haas-парсера легальна, эмиссионная — profile-флаг этапа 8).
# Формат TOML (R-1, IMPLEMENTATION-PLAN §6); ключи kebab-case
# (serde rename_all = "kebab-case" на MachineProfile/Limits).
name = "Haas default"
dialect = "haas"
emit-r-arcs = false
# emit-preamble (#11): false — заголовок GENERATED BY EID не пишется; true →
# первая строка выхода `(GENERATED BY EID — VERIFY IN SIMULATOR BEFORE MACHINING)`
# (только integration-слой; библиотечные emit() не меняются).
emit-preamble = false
# axis-limits-units (#27): единицы, в которых заданы axis-limits ("mm"|"in");
# несовпадение с units программы → масштабирование ×25.4/÷25.4 в mock-sim.
axis-limits-units = "mm"

[limits]
max-ops-per-program = 200000
max-unroll-iterations = 10000
max-source-lines = 1000000
max-word-chars = 32
