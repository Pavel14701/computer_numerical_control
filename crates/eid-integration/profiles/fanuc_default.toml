# MachineProfile по умолчанию: Fanuc (Агент E, итерация 6 — аудит #25; TOML с
# итерации 3 — R-1). По образцу grbl_default.toml / linuxcnc_default.toml.
#
# СТАТУС (#25): диалект "fanuc" валиден в профилях и CLI-словаре, но адаптер
# eid-fanuc в разработке — парсер этапы 2-3, эмиссия этап 3. Registry
# (eid-integration::translate::AnyAdapter::for_name("fanuc")) честно отвечает
# AdapterPending без паники; крейт eid-fanuc НЕ подключён как зависимость
# eid-integration (API в полёте).
#
# Лимиты — дефолты COVERAGE §1.2 (200000 / 10000 / 1000000 / 32).
# emit_r_arcs: false — политика EQUIVALENCE §4: эмиссия дуг всегда IJK;
# R-эмиссия — только по флагу профиля с notice-диагностикой.
# Формат TOML (R-1, IMPLEMENTATION-PLAN §6: serde_yaml в maintenance mode +
# unsafe-libyaml транзитивно); ключи kebab-case
# (serde rename_all = "kebab-case" на MachineProfile/Limits).
name = "Fanuc default"
dialect = "fanuc"
emit-r-arcs = false
# emit-preamble (#11): false — заголовок GENERATED BY EID не пишется; true →
# первая строка выхода `(GENERATED BY EID — VERIFY IN SIMULATOR BEFORE MACHINING)`
# (только integration-слой; библиотечные emit() не меняются).
emit-preamble = false
# axis-limits-units (#27): единицы, в которых заданы axis-limits ("mm"|"in");
# несовпадение с units программы → масштабирование ×25.4/÷25.4 в mock-sim.
axis-limits-units = "mm"

[limits]
max-ops-per-program = 200000
max-unroll-iterations = 10000
max-source-lines = 1000000
max-word-chars = 32
