# CORPUS manifest — пилотная партия (CORPUS-CONTRACT §8)
# sha256 проставляются скриптом при выпуске корпуса; отсутствие ключа = черновик.
# R4-ожидания — явные per-vector (CORPUS §6), не выводятся из общих правил.
# Формат — TOML (миграция R-1, IMPLEMENTATION-PLAN §6): serde_yaml deprecated
# с 2024 + unsafe-libyaml транзитивно; YAML-версия удалена (дрейф недопустим).

