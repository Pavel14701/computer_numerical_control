# eid — минимальный INI для headless-интерпретации (rs274)
# Конфигурация: mm, все оси линейные, без станочной специфики
[RS274NGC]
PROGRAM_PREFIX = /work
PARAMETER_FILE = /work/mini.var

[EMC]
MACHINE = eid-sim
DEBUG = 0

[DISPLAY]

[TASK]

[HAL]

[TRAJ]
AXES = 3
UNITS = MM

[AXIS_0]
TYPE = LINEAR
MAX_VELOCITY = 100.0
HOME = 0.0

[AXIS_1]
TYPE = LINEAR
MAX_VELOCITY = 100.0
HOME = 0.0

[AXIS_2]
TYPE = LINEAR
MAX_VELOCITY = 100.0
HOME = 0.0

[EMCMOT]

[HAL]

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,G-code
